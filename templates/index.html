<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- cool font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barrio&display=swap" rel="stylesheet">
    <style>
        
        h1 {
            display: flex;
            justify-content: center;
            font-family: "Barrio", system-ui;
            font-size: 75px;
            font-weight: 100;
            font-style: normal; 
        }
        .container{
            /* display: flex; */
            text-align:left;
        }

        .container2 {
            margin-top:50px;
            padding-top:50px;
        }
        .centeredhead {
            display: flex;
            justify-content: center;
        }

        .btn2 {
            display: flex;
            text-align: right;
        }

        .barrio-regular {
            font-family: "Barrio", system-ui;
            font-weight: 400;
            font-style: normal;
        }

        .barrio-header {
            font-family: "Barrio", system-ui;
            font-weight: 800;
            font-style: normal;
        }

    </style>
</head>

<body>
    <h1>
       Contact Manager
    </h1>

    <div class = "container bg-light p-2 rounded-2">
        <form method = 'post'>
            <div class = "mb-3">
                <div label for = "note" class = "form-label barrio-header centeredhead"><strong>New Contact: </strong></label></div>
                
                <label for = "note" class = "form-label barrio-regular">Name: </label>
                <textarea name ='name' class = "form-control" id = "name" rows = "1"></textarea>
                <label for = "note" class = "form-label barrio-regular">Phone Number: </label>
                <textarea name ='number' class = "form-control" id = "number" rows = "1"></textarea>
            </div>
            <!-- fix -->
            <button name = 'savenote' type = "submit" class = "btn btn-sm btn-primary mb-3 barrio-regular centeredhead">Submit</button>
        </form>
    </div>
    <div class = "container2 p-0 rounded-2">
        <h5 class = "barrio-header centerhead">My Contacts</h5>

    </div>

</body>
</html>
