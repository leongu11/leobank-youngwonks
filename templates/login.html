<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            background-image: url('/static/images/bro2.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        h1 {
            padding:20px;
            font-size: 30px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        h3 {
            padding-right: 20px;
            padding:10px;
            font-size: 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        a {
            display:flex;
            padding-left:45px;
            padding-bottom:60px;
            align-items: center;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <h1>BIGBANK</h1>
    <h3>smrtr banking</h3>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div id = "alerted" class = "alert alert-primary alert-dismissible fade show" role="alert">
                    {{message}}
                </div>
                <script>
                    setTimeout(() => {
                    const alert = document.getElementById('alerted');
                    alert.style.display = 'none'; // Completely removes it from layout
                    }, 3000);
                </script>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <a href="javascript:void(0)" onclick="document.getElementById('myDialog').showModal()">signup</a>
    <dialog id="myDialog">
        <h2>sign-up</h2>
        <form method = "POST">
        <!-- for popup -->
        <input type = "hidden" name="new">
        <label>email:</label>
        <textarea name ='emailans' class = "form-control" rows = "1"></textarea>
        <label>password:</label>
        <textarea name ='passans' class = "form-control" rows = "1"></textarea>
        <label>username:</label>
        <textarea name ='userans' class = "form-control" rows = "1"></textarea>
            <button type = "submit" name = "formsid" value = "register" >signup</button>
            <button type = "button" onclick="this.closest('dialog').close()" value = "register" >close</button>
        </form>
    </dialog>
    
    <a href="javascript:void(0)" onclick="document.getElementById('myDialog2').showModal()">login</a>
    <dialog id="myDialog2">
        <h2>login</h2>
        <form method = "POST">
        <!-- for popup -->
        <input type = "hidden" name="new">
        <label>email:</label>
        <textarea name ='emailentry' class = "form-control" rows = "1"></textarea>
        <label>password:</label>
        <textarea name ='passtry' class = "form-control" rows = "1"></textarea>

            <button type = "submit" name = "formsid" value = "login">login</button>
            <button type = "button" onclick="this.closest('dialog').close()">close</button>
        </form>
    </dialog>
</body>
</html>
